---
name: Build - Moonlight Flatpak

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: moonlight-flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build x86_64 Flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout selected Moonlight branch
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 1

      - name: Resolve selected Moonlight revision
        id: source
        shell: bash
        run: |
          SOURCE_SHA="${GITHUB_SHA}"
          SOURCE_BRANCH="${GITHUB_REF_NAME}"
          SAFE_BRANCH="${SOURCE_BRANCH//\//-}"
          echo "sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SOURCE_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "safe_branch=${SAFE_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Install Flatpak build tools
        shell: bash
        run: |
          # Chrome is preconfigured on GitHub-hosted runners but is unrelated to
          # this build. Disable its apt source so transient repository metadata
          # mismatches cannot prevent us from installing Flatpak tooling.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder musl-tools
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build static SteamOS priority helper
        shell: bash
        run: |
          mkdir -p host-helper
          musl-gcc \
            -std=c11 \
            -O2 \
            -Wall \
            -Wextra \
            -Werror \
            -static \
            tools/moonlight-priority-helper.c \
            -o host-helper/moonlight-priority-helper
          strip host-helper/moonlight-priority-helper
          cp tools/install-moonlight-priority-helper.sh host-helper/
          chmod 0755 host-helper/moonlight-priority-helper \
                     host-helper/install-moonlight-priority-helper.sh
          file host-helper/moonlight-priority-helper

      - name: Pin Moonlight and Common C source revisions
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          COMMON_C_SHA: e834dd74b35963167efb3b31be87c7fe85cf0701
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          manifest = Path("com.moonlight_stream.Moonlight.yaml")
          lines = manifest.read_text().splitlines(keepends=True)

          def pin_git_source(lines, url, commit):
              source_url = f"        url: {url}\n"
              try:
                  url_index = lines.index(source_url)
              except ValueError:
                  raise SystemExit(f"Unable to locate git source in Flatpak manifest: {url}")

              source_end = len(lines)
              for i in range(url_index + 1, len(lines)):
                  if lines[i].startswith("      - type: "):
                      source_end = i
                      break

              source_options = [
                  line for line in lines[url_index + 1:source_end]
                  if not line.startswith("        branch: ")
                  and not line.startswith("        commit: ")
              ]

              return (
                  lines[:url_index + 1]
                  + [f"        commit: {commit}\n"]
                  + source_options
                  + lines[source_end:]
              )

          lines = pin_git_source(
              lines,
              "https://github.com/mspeedo/moonlight-qt.git",
              os.environ["SOURCE_SHA"],
          )
          lines = pin_git_source(
              lines,
              "https://github.com/mspeedo/moonlight-common-c.git",
              os.environ["COMMON_C_SHA"],
          )

          manifest.write_text("".join(lines))
          print(f"Pinned Moonlight Qt to {os.environ['SOURCE_SHA']}")
          print(f"Pinned Moonlight Common C to {os.environ['COMMON_C_SHA']}")
          PY

      - name: Build Flatpak
        shell: bash
        run: |
          flatpak-builder \
            --repo=repo \
            build-dir \
            com.moonlight_stream.Moonlight.yaml \
            --force-clean \
            --ccache \
            --install-deps-from=flathub \
            --disable-rofiles-fuse \
            --user

      - name: Create installable Flatpak bundle
        shell: bash
        run: |
          flatpak build-bundle \
            repo \
            "Moonlight-${{ steps.source.outputs.safe_branch }}-${{ steps.source.outputs.short_sha }}.flatpak" \
            com.moonlight_stream.Moonlight

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v6
        with:
          name: Moonlight-${{ steps.source.outputs.safe_branch }}-${{ steps.source.outputs.short_sha }}
          path: Moonlight-${{ steps.source.outputs.safe_branch }}-${{ steps.source.outputs.short_sha }}.flatpak
          compression-level: 0
          if-no-files-found: error

      - name: Upload SteamOS priority helper artifact
        uses: actions/upload-artifact@v6
        with:
          name: Moonlight-Priority-Helper-${{ steps.source.outputs.short_sha }}
          path: |
            host-helper/moonlight-priority-helper
            host-helper/install-moonlight-priority-helper.sh
          compression-level: 0
          if-no-files-found: error
