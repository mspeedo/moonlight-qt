---
name: Build - Moonlight Flatpak

permissions:
  contents: read

on:
  workflow_dispatch:
  # Build all new commits; publish only the remote-sunshine-settings
  # branch when R2 secrets and variables are configured.
  push:
    branches:
      - vrr-image-adjustments
      - feature/remote-sunshine-settings
      - feature/flatpak-update-page

concurrency:
  group: moonlight-flatpak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build x86_64 Flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout selected Moonlight branch
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 1

      - name: Resolve selected Moonlight revision
        id: source
        shell: bash
        run: |
          SOURCE_SHA="${GITHUB_SHA}"
          SOURCE_BRANCH="${GITHUB_REF_NAME}"
          SAFE_BRANCH="${SOURCE_BRANCH//\//-}"
          echo "sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SOURCE_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "safe_branch=${SAFE_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Install Flatpak build tools
        shell: bash
        run: |
          # Chrome is preconfigured on GitHub-hosted runners but is unrelated to
          # this build. Disable its apt source so transient repository metadata
          # mismatches cannot prevent us from installing Flatpak tooling.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder rclone gnupg
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Pin selected Moonlight source revision
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          manifest = Path("com.moonlight_stream.Moonlight.yaml")
          lines = manifest.read_text().splitlines(keepends=True)

          def pin_git_source(lines, url, commit):
              source_url = f"        url: {url}\n"
              try:
                  url_index = lines.index(source_url)
              except ValueError:
                  raise SystemExit(f"Unable to locate git source in Flatpak manifest: {url}")

              source_end = len(lines)
              for i in range(url_index + 1, len(lines)):
                  if lines[i].startswith("      - type: "):
                      source_end = i
                      break

              source_options = [
                  line for line in lines[url_index + 1:source_end]
                  if not line.startswith("        branch: ")
                  and not line.startswith("        commit: ")
              ]

              return (
                  lines[:url_index + 1]
                  + [f"        commit: {commit}\n"]
                  + source_options
                  + lines[source_end:]
              )

          lines = pin_git_source(
              lines,
              "https://github.com/mspeedo/moonlight-qt.git",
              os.environ["SOURCE_SHA"],
          )
          manifest.write_text("".join(lines))
          print(f"Pinned Moonlight Qt to {os.environ['SOURCE_SHA']}")
          PY

      - name: Restore and configure signed Flatpak R2 repository
        id: r2
        if: github.ref == 'refs/heads/feature/remote-sunshine-settings'
        shell: bash
        env:
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ENV_AUTH: 'false'
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          RCLONE_CONFIG_R2_REGION: auto
        run: bash .github/scripts/publish-flatpak-r2.sh prepare

      - name: Build Flatpak
        shell: bash
        env:
          FLATPAK_GPG_KEY_ID: ${{ steps.r2.outputs.key_id }}
        run: |
          # The normal CI artifact still builds when R2 is not configured.
          sign_args=()
          if [[ -n "$FLATPAK_GPG_KEY_ID" ]]; then
            sign_args+=("--gpg-sign=$FLATPAK_GPG_KEY_ID")
          fi
          flatpak-builder \
            --repo=repo \
            "${sign_args[@]}" \
            build-dir \
            com.moonlight_stream.Moonlight.yaml \
            --force-clean \
            --ccache \
            --install-deps-from=flathub \
            --disable-rofiles-fuse \
            --user

      - name: Create installable Flatpak bundle
        shell: bash
        run: |
          flatpak build-bundle \
            repo \
            "Moonlight-${{ steps.source.outputs.safe_branch }}-${{ steps.source.outputs.short_sha }}.flatpak" \
            com.moonlight_stream.Moonlight

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v7
        with:
          name: Moonlight-${{ steps.source.outputs.safe_branch }}-${{ steps.source.outputs.short_sha }}
          path: Moonlight-${{ steps.source.outputs.safe_branch }}-${{ steps.source.outputs.short_sha }}.flatpak
          compression-level: 0
          if-no-files-found: error

      - name: Publish signed OSTree Flatpak repository to R2
        if: steps.r2.outputs.enabled == 'true'
        shell: bash
        env:
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          FLATPAK_GPG_KEY_ID: ${{ steps.r2.outputs.key_id }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ENV_AUTH: 'false'
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          RCLONE_CONFIG_R2_REGION: auto
        run: bash .github/scripts/publish-flatpak-r2.sh publish
